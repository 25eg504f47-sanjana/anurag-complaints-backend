server.port=${PORT:8080}

# Database (Aiven MySQL). Set DB_URL / DB_USERNAME / DB_PASSWORD as environment variables.
# Aiven needs SSL, e.g. jdbc:mysql://<host>:<port>/defaultdb?sslMode=REQUIRED
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Auth (no defaults on purpose: the app refuses to start without a real secret)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Comma-separated list; wildcards allowed, e.g. https://my-app.vercel.app,https://*.netlify.app
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# First admin account, created at startup if the email does not exist yet
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health
